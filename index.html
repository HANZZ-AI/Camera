<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NexCam - Kamera RGB Merah</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at 20% 30%, #0a0000, #1a0303);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            font-family: 'Poppins', 'Segoe UI', system-ui, -apple-system, 'Inter', sans-serif;
        }

        /* wadah utama dengan aksen merah neon */
        .camera-neon {
            max-width: 600px;
            width: 100%;
            background: rgba(20, 5, 5, 0.75);
            backdrop-filter: blur(12px);
            border-radius: 48px;
            border: 1px solid rgba(255, 40, 40, 0.7);
            box-shadow: 0 20px 40px rgba(255, 0, 0, 0.25), 0 0 18px rgba(255, 30, 30, 0.5);
            padding: 20px 20px 30px;
            transition: 0.2s;
        }

        /* header dengan sentuhan merah */
        .brand {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 12px;
            flex-wrap: wrap;
            border-bottom: 1px dashed #ff4d4d;
            padding-bottom: 8px;
        }
        h1 {
            font-size: 1.9rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ff4d4d, #ff9999);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 8px rgba(255,0,0,0.4);
            letter-spacing: -0.5px;
        }
        .dev-by {
            background: #ff1a1a30;
            backdrop-filter: blur(4px);
            padding: 5px 12px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: bold;
            color: #ffb3b3;
            border: 0.5px solid #ff4444;
        }
        .dev-by span {
            color: #ff8080;
        }

        .video-box {
            background: #000000aa;
            border-radius: 32px;
            overflow: hidden;
            margin: 15px 0 18px;
            border: 2px solid #ff3333;
            box-shadow: 0 0 0 2px #7a0000, 0 10px 25px rgba(0,0,0,0.5);
            position: relative;
        }
        video {
            width: 100%;
            height: auto;
            display: block;
            /* HAPUS mirror effect - kamera asli tanpa flip */
            transform: scaleX(1);
            background: #111;
        }

        /* kontrol tombol utama */
        .action-row {
            display: flex;
            justify-content: center;
            gap: 18px;
            margin: 12px 0 20px;
            flex-wrap: wrap;
        }
        .btn {
            border: none;
            background: #2c0a0a;
            padding: 12px 20px;
            border-radius: 60px;
            font-weight: bold;
            font-size: 1rem;
            color: #ffc2c2;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(4px);
            transition: 0.2s;
            cursor: pointer;
            border: 1px solid #ff4f4f;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }
        .btn-primary {
            background: #e60000;
            color: white;
            box-shadow: 0 0 12px #ff3a3a;
            border: none;
        }
        .btn-primary:active { transform: scale(0.96); background: #cc0000;}
        .btn:active { transform: scale(0.96);}
        .btn-outline-red {
            background: #1f0505;
            border: 1px solid #ff6666;
        }
        .icon {
            font-size: 1.3rem;
        }

        /* galeri thumbnail */
        .mini-gallery {
            background: rgba(0,0,0,0.6);
            border-radius: 28px;
            padding: 12px;
            margin-top: 12px;
            border: 1px solid #ff4d4d60;
        }
        .mini-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding: 0 6px;
            color: #ffbaba;
            font-weight: 600;
        }
        .thumb-scroll {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 8px;
        }
        .thumb-item {
            width: 75px;
            height: 75px;
            background: #2b0a0a;
            border-radius: 18px;
            overflow: hidden;
            border: 2px solid #ff5e5e;
            flex-shrink: 0;
            position: relative;
        }
        .thumb-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .delete-one {
            position: absolute;
            top: 2px;
            right: 2px;
            background: #aa0000dd;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: white;
            font-weight: bold;
        }
        .empty-text {
            text-align: center;
            color: #ffaaaa;
            padding: 20px;
            font-style: italic;
        }
        .status-msg {
            background: #270000aa;
            border-radius: 40px;
            padding: 6px 12px;
            margin-top: 15px;
            text-align: center;
            font-size: 0.75rem;
            color: #ffaaaa;
        }
        footer {
            font-size: 0.65rem;
            text-align: center;
            margin-top: 18px;
            color: #cc7a7a;
        }
        .btn-sm {
            background: #4a1212;
            padding: 6px 12px;
            font-size: 0.7rem;
            border: none;
            border-radius: 30px;
            color: white;
            cursor: pointer;
        }
        .flex-btns {
            display: flex;
            gap: 12px;
        }
        @media (max-width: 500px) {
            .camera-neon { padding: 14px; }
            .btn { padding: 10px 14px; font-size: 0.85rem; }
        }
    </style>
</head>
<body>
<div class="camera-neon">
    <div class="brand">
        <h1>◉ NEXCAM</h1>
        <div class="dev-by">⚡ Dev by <span>HANZZ</span> ⚡</div>
    </div>
    
    <div class="video-box">
        <video id="videoElement" autoplay playsinline muted></video>
    </div>

    <div class="action-row">
        <button id="captureBtn" class="btn btn-primary"><span class="icon">📸</span> JEPRET</button>
        <button id="switchCamBtn" class="btn btn-outline-red"><span class="icon">🔄</span> Ganti Kamera</button>
        <button id="galleryRedirectBtn" class="btn btn-outline-red"><span class="icon">🖼️</span> Cek Foto</button>
    </div>

    <!-- preview mini galeri dengan hapus cepat -->
    <div class="mini-gallery">
        <div class="mini-header">
            <span>📸 Foto terbaru</span>
            <button id="resetMiniBtn" class="btn-sm" style="background:#8b0000;">🗑️ Hapus Semua</button>
        </div>
        <div id="miniThumbList" class="thumb-scroll">
            <div class="empty-text">✨ Belum ada foto, ambil dulu yuk!</div>
        </div>
    </div>
    <div class="status-msg" id="camStatus">🔴 Menyalakan kamera RGB ...</div>
    <footer>mode asli (tanpa mirror/cermin) | kamera seperti pandangan nyata</footer>
</div>

<script>
    (function(){
        // elemen
        const video = document.getElementById('videoElement');
        const captureBtn = document.getElementById('captureBtn');
        const switchCamBtn = document.getElementById('switchCamBtn');
        const galleryRedirectBtn = document.getElementById('galleryRedirectBtn');
        const miniThumbDiv = document.getElementById('miniThumbList');
        const resetMiniBtn = document.getElementById('resetMiniBtn');
        const camStatusSpan = document.getElementById('camStatus');

        // global
        let currentStream = null;
        let facingMode = "environment";   // default ke kamera belakang (seperti kamera asli)
        let photosArray = [];              // simpan base64

        // --- fungsi render thumbnail mini di index.html ---
        function renderMiniGallery() {
            miniThumbDiv.innerHTML = '';
            if(photosArray.length === 0){
                const emptyDiv = document.createElement('div');
                emptyDiv.className = 'empty-text';
                emptyDiv.innerText = '📭 Belum ada foto, ambil dulu yuk!';
                miniThumbDiv.appendChild(emptyDiv);
                return;
            }
            // tampilkan terbaru di depan (reverse)
            const reversed = [...photosArray].reverse();
            for(let i=0; i<reversed.length; i++){
                const imgData = reversed[i];
                const originalIndex = photosArray.length - 1 - i;
                const thumbDiv = document.createElement('div');
                thumbDiv.className = 'thumb-item';
                const img = document.createElement('img');
                img.src = imgData;
                const delBtn = document.createElement('div');
                delBtn.innerText = '✕';
                delBtn.className = 'delete-one';
                delBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    deletePhotoByIndex(originalIndex);
                });
                thumbDiv.appendChild(img);
                thumbDiv.appendChild(delBtn);
                miniThumbDiv.appendChild(thumbDiv);
            }
        }

        function deletePhotoByIndex(idx){
            if(idx >=0 && idx < photosArray.length){
                photosArray.splice(idx,1);
                saveToLocal();
                renderMiniGallery();
            }
        }

        function resetAllPhotos(){
            if(photosArray.length > 0){
                photosArray = [];
                saveToLocal();
                renderMiniGallery();
                camStatusSpan.innerText = '✅ Semua foto terhapus';
                setTimeout(()=>{ if(currentStream) camStatusSpan.innerText = '📷 Kamera aktif (belakang)'; },1500);
            } else {
                camStatusSpan.innerText = '⚠️ Tidak ada foto untuk dihapus';
            }
        }

        function saveToLocal(){
            localStorage.setItem('nexcam_photos', JSON.stringify(photosArray));
        }

        function loadFromLocal(){
            const stored = localStorage.getItem('nexcam_photos');
            if(stored){
                try {
                    const parsed = JSON.parse(stored);
                    if(Array.isArray(parsed)){
                        photosArray = parsed;
                        renderMiniGallery();
                    }
                } catch(e){}
            } else {
                photosArray = [];
                renderMiniGallery();
            }
        }

        // fungsi stop stream
        function stopStream(){
            if(currentStream){
                currentStream.getTracks().forEach(track => {
                    if(track.readyState === 'live') track.stop();
                });
                currentStream = null;
            }
        }

        // inisialisasi kamera dengan facingMode tertentu (environment / user)
        // TAMBAHKAN: memastikan tidak ada mirror effect sama sekali (tidak ada transformasi CSS)
        async function initCamera(facing) {
            stopStream();
            const constraints = {
                video: {
                    facingMode: { exact: facing } ,
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                }
            };
            try {
                camStatusSpan.innerText = `🔄 Mengakses kamera ${facing === 'environment' ? 'belakang' : 'depan'} ...`;
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                handleStream(stream);
                // Pastikan video tidak mirror via CSS (tambahan safety)
                video.style.transform = 'scaleX(1)';
                return true;
            } catch(err){
                console.warn(`gagal dengan facingMode ${facing}, coba non-exact`, err);
                // fallback tanpa exact, tetap dengan facingMode preferensi
                try{
                    const fallbackConstraints = { video: { facingMode: facing } };
                    const fallbackStream = await navigator.mediaDevices.getUserMedia(fallbackConstraints);
                    handleStream(fallbackStream);
                    video.style.transform = 'scaleX(1)';
                    return true;
                } catch(err2){
                    console.error("gagal total kamera :", err2);
                    camStatusSpan.innerText = '❌ Gagal akses kamera / izin ditolak';
                    return false;
                }
            }
        }

        function handleStream(stream){
            currentStream = stream;
            video.srcObject = stream;
            video.onloadedmetadata = () => {
                video.play();
                const modeText = facingMode === 'environment' ? 'KAMERA BELAKANG (asli)' : 'KAMERA DEPAN (asli tanpa mirror)';
                camStatusSpan.innerText = `✅ ${modeText} · tidak mirror`;
            };
            video.onerror = () => camStatusSpan.innerText = '⚠️ Error video';
        }

        // ganti kamera depan / belakang dengan non-mirror : toggle antara environment dan user
        async function switchCamera(){
            const newMode = (facingMode === 'environment') ? 'user' : 'environment';
            const success = await initCamera(newMode);
            if(success){
                facingMode = newMode;
                camStatusSpan.innerText = `🔄 Beralih ke ${facingMode === 'environment' ? 'kamera BELAKANG' : 'kamera DEPAN'} (real tanpa mirror)`;
            } else {
                camStatusSpan.innerText = '⚠️ Gagal ganti kamera, pastikan izin & multi kamera tersedia';
            }
        }

        // mengambil foto (tanpa mirror, hasil sesuai video asli)
        // PASTIKAN tidak ada efek mirror di canvas
        function capturePhoto(){
            if(!video.videoWidth || !video.videoHeight){
                camStatusSpan.innerText = '⏳ Tunggu kamera siap...';
                return;
            }
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            // menggambar persis dari video (tidak ada flip, sehingga hasil seperti kamera asli)
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const photoURL = canvas.toDataURL('image/png');
            photosArray.push(photoURL);
            saveToLocal();
            renderMiniGallery();
            // efek kilat semu (flash merah)
            const flashDiv = document.createElement('div');
            flashDiv.style.position = 'fixed'; flashDiv.style.top=0; flashDiv.style.left=0; flashDiv.style.width='100%'; flashDiv.style.height='100%';
            flashDiv.style.background = 'rgba(255,50,50,0.7)'; flashDiv.style.pointerEvents = 'none'; flashDiv.style.zIndex = 9999;
            document.body.appendChild(flashDiv);
            setTimeout(()=> flashDiv.remove(), 100);
            camStatusSpan.innerText = '📸 Foto tersimpan! (galeri terbaru)';
            setTimeout(()=> {
                if(currentStream) camStatusSpan.innerText = `✅ Kamera ${facingMode === 'environment' ? 'belakang' : 'depan'} siap`;
            },1200);
        }

        // Tombol cek foto -> redirect ke index2.html
        function goToGallery(){
            saveToLocal();
            window.location.href = 'index2.html';
        }

        // event binding & load
        captureBtn.addEventListener('click', capturePhoto);
        switchCamBtn.addEventListener('click', switchCamera);
        galleryRedirectBtn.addEventListener('click', goToGallery);
        resetMiniBtn.addEventListener('click', resetAllPhotos);

        // load data awal dari localStorage
        loadFromLocal();

        // cek dukungan kamera
        if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
            camStatusSpan.innerText = '❌ Browser tidak support kamera.';
            document.querySelector('.video-box').style.background = '#220000';
        } else {
            // default pakai kamera belakang (environment) -> tidak mirror seperti kamera asli
            initCamera('environment').catch(()=>{
                camStatusSpan.innerText = '⚠️ Gagal buka kamera belakang, coba depan';
                initCamera('user').catch(()=>{
                    camStatusSpan.innerText = '❌ Akses kamera ditolak';
                });
            });
        }

        // saat keluar halaman, bersihkan stream
        window.addEventListener('beforeunload', ()=>{
            if(currentStream){
                currentStream.getTracks().forEach(t=>t.stop());
            }
        });
    })();
</script>
</body>
</html>
