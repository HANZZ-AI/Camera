<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Camera</title>

    <!-- JSZip CDN untuk fitur download all (zip) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js">
    </script>

    <style>
        :root {
            --bg: #0d0d0d;
            --surface: #1a1a1a;
            --text: #ffffff;
            --text-secondary: #b0b0b0;
            --accent: #ffffff;
            --danger: #ff4d4d;
            --danger-hover: #e63939;
            --success: #4caf50;
            --border: #2a2a2a;
            --radius: 16px;
            --radius-sm: 10px;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --font: 'Segoe UI', 'SF Pro Display', 'Helvetica Neue', system-ui, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
        }

        /* ============ HALAMAN KAMERA ============ */
        #camera-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 16px;
            position: relative;
        }

        .camera-wrapper {
            position: relative;
            width: 100%;
            max-width: 520px;
            aspect-ratio: 3 / 4;
            max-height: 75vh;
            max-height: 75dvh;
            border-radius: var(--radius);
            overflow: hidden;
            background: #000;
            box-shadow: var(--shadow);
            border: 2px solid var(--border);
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.15s ease;
        }

        #video.mirror {
            transform: scaleX(-1);
        }

        /* Overlay grid halus ala kamera */
        .camera-wrapper::after {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(0deg, transparent 49.8%, rgba(255, 255, 255, 0.03) 49.8%, rgba(255, 255, 255, 0.03) 50.2%, transparent 50.2%),
                linear-gradient(90deg, transparent 49.8%, rgba(255, 255, 255, 0.03) 49.8%, rgba(255, 255, 255, 0.03) 50.2%, transparent 50.2%);
            background-size: 33.33% 33.33%;
            z-index: 2;
            border-radius: inherit;
        }

        /* Flash effect */
        .flash-overlay {
            position: absolute;
            inset: 0;
            background: white;
            opacity: 0;
            pointer-events: none;
            z-index: 5;
            border-radius: inherit;
            transition: opacity 0.08s ease-out;
        }
        .flash-overlay.active {
            opacity: 0.85;
            transition: opacity 0s;
        }

        #canvas {
            display: none;
        }

        /* Kontrol kamera */
        .camera-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 28px;
            margin-top: 24px;
            flex-wrap: wrap;
        }

        .btn-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.35);
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            position: relative;
        }
        .btn-icon:hover {
            background: rgba(255, 255, 255, 0.16);
            border-color: rgba(255, 255, 255, 0.6);
            transform: scale(1.05);
        }
        .btn-icon:active {
            transform: scale(0.94);
            transition: 0.1s ease;
        }

        .btn-icon .badge {
            position: absolute;
            top: -6px;
            right: -6px;
            background: var(--danger);
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            min-width: 20px;
            height: 20px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 5px;
            line-height: 1;
            pointer-events: none;
            border: 2px solid var(--bg);
        }

        /* Tombol capture */
        #capture-btn {
            width: 74px;
            height: 74px;
            border-radius: 50%;
            border: 5px solid #ffffff;
            background: transparent;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            flex-shrink: 0;
        }
        #capture-btn::after {
            content: '';
            position: absolute;
            inset: 8px;
            border-radius: 50%;
            background: #ffffff;
            transition: var(--transition);
        }
        #capture-btn:hover {
            transform: scale(1.07);
            box-shadow: 0 0 32px rgba(255, 255, 255, 0.3);
        }
        #capture-btn:active {
            transform: scale(0.9);
            transition: 0.1s ease;
        }
        #capture-btn:active::after {
            inset: 12px;
            background: #e0e0e0;
        }

        /* Error / Permission message */
        .permission-message {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.85);
            border-radius: var(--radius);
            gap: 12px;
        }
        .permission-message .icon {
            font-size: 56px;
            margin-bottom: 8px;
        }
        .permission-message h3 {
            font-size: 1.2rem;
            font-weight: 600;
        }
        .permission-message p {
            font-size: 0.9rem;
            color: var(--text-secondary);
            max-width: 280px;
            line-height: 1.4;
        }
        .permission-message button {
            margin-top: 8px;
            padding: 10px 22px;
            border-radius: 24px;
            border: none;
            background: #fff;
            color: #000;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: var(--transition);
        }
        .permission-message button:hover {
            background: #e0e0e0;
            transform: scale(1.03);
        }

        /* ============ HALAMAN GALERI ============ */
        #gallery-page {
            display: none;
            flex-direction: column;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 16px;
            max-width: 900px;
            margin: 0 auto;
        }
        #gallery-page.active {
            display: flex;
        }
        #camera-page.hidden {
            display: none;
        }

        .gallery-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            padding: 8px 0 20px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
            position: sticky;
            top: 0;
            background: var(--bg);
            z-index: 10;
        }
        .gallery-header h2 {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -0.3px;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }
        .gallery-header .btn-back {
            background: var(--surface);
            border: 1px solid var(--border);
            color: #fff;
            padding: 10px 16px;
            border-radius: 24px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        .gallery-header .btn-back:hover {
            background: #2a2a2a;
            border-color: #444;
        }
        .gallery-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .btn-action {
            padding: 10px 16px;
            border-radius: 24px;
            border: 1px solid var(--border);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            background: var(--surface);
            color: #fff;
        }
        .btn-action:hover {
            background: #2a2a2a;
            border-color: #555;
        }
        .btn-action.danger {
            border-color: rgba(255, 77, 77, 0.4);
            color: #ff6b6b;
            background: rgba(255, 77, 77, 0.08);
        }
        .btn-action.danger:hover {
            background: rgba(255, 77, 77, 0.18);
            border-color: rgba(255, 77, 77, 0.7);
        }
        .btn-action.success {
            border-color: rgba(76, 175, 80, 0.4);
            color: #66d96a;
            background: rgba(76, 175, 80, 0.08);
        }
        .btn-action.success:hover {
            background: rgba(76, 175, 80, 0.18);
            border-color: rgba(76, 175, 80, 0.7);
        }
        .btn-action:disabled {
            opacity: 0.35;
            pointer-events: none;
            cursor: not-allowed;
        }

        /* Grid foto */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
            padding-bottom: 32px;
        }
        @media (min-width: 600px) {
            .photo-grid {
                grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
                gap: 16px;
            }
        }
        @media (min-width: 900px) {
            .photo-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 18px;
            }
        }

        .photo-item {
            position: relative;
            aspect-ratio: 3 / 4;
            border-radius: var(--radius-sm);
            overflow: hidden;
            background: var(--surface);
            border: 1px solid var(--border);
            transition: var(--transition);
            cursor: default;
            animation: fadeInUp 0.4s ease forwards;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .photo-item:hover {
            border-color: #555;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }
        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .photo-item .photo-actions {
            position: absolute;
            top: 6px;
            right: 6px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            opacity: 0;
            transform: translateX(6px);
            transition: var(--transition);
            z-index: 3;
        }
        .photo-item:hover .photo-actions,
        .photo-item:active .photo-actions {
            opacity: 1;
            transform: translateX(0);
        }
        .photo-item .btn-sm {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .btn-sm.delete {
            background: rgba(255, 60, 60, 0.75);
            color: #fff;
        }
        .btn-sm.delete:hover {
            background: rgba(255, 40, 40, 0.9);
            transform: scale(1.1);
        }
        .btn-sm.download {
            background: rgba(255, 255, 255, 0.75);
            color: #000;
        }
        .btn-sm.download:hover {
            background: rgba(255, 255, 255, 0.95);
            transform: scale(1.1);
        }

        /* Pesan kosong */
        .empty-message {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 48px 24px;
            color: var(--text-secondary);
            gap: 10px;
        }
        .empty-message .icon {
            font-size: 56px;
            opacity: 0.5;
        }
        .empty-message p {
            font-size: 1rem;
            line-height: 1.5;
        }

        /* Toast notifikasi */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #333;
            color: #fff;
            padding: 12px 20px;
            border-radius: 24px;
            font-size: 0.9rem;
            font-weight: 500;
            z-index: 100;
            pointer-events: none;
            transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        /* Responsif */
        @media (max-width: 480px) {
            .camera-wrapper {
                max-height: 65vh;
                max-height: 65dvh;
                border-radius: var(--radius-sm);
            }
            #capture-btn {
                width: 64px;
                height: 64px;
                border-width: 4px;
            }
            #capture-btn::after {
                inset: 7px;
            }
            .btn-icon {
                width: 40px;
                height: 40px;
                font-size: 17px;
            }
            .camera-controls {
                gap: 20px;
                margin-top: 18px;
            }
            .gallery-header {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }
            .gallery-header h2 {
                position: static;
                transform: none;
                text-align: center;
            }
            .gallery-actions {
                justify-content: center;
            }
            .photo-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
            }
        }
    </style>
</head>
<body>

    <!-- ==================== HALAMAN KAMERA ==================== -->
    <div id="camera-page">
        <div class="camera-wrapper" id="camera-wrapper">
            <video id="video" autoplay playsinline muted></video>
            <div class="flash-overlay" id="flash-overlay"></div>
            <div class="permission-message" id="permission-message" style="display:none;">
                <span class="icon">📷</span>
                <h3>Akses Kamera Diperlukan</h3>
                <p>Izinkan akses kamera untuk mulai mengambil foto.</p>
                <button id="retry-camera-btn">🔄 Coba Lagi</button>
            </div>
        </div>
        <canvas id="canvas"></canvas>

        <div class="camera-controls">
            <!-- Tombol galeri -->
            <button class="btn-icon" id="gallery-btn" title="Galeri Foto">
                🖼️
                <span class="badge" id="photo-count-badge" style="display:none;">0</span>
            </button>

            <!-- Tombol capture -->
            <button id="capture-btn" title="Ambil Foto"></button>

            <!-- Tombol switch kamera -->
            <button class="btn-icon" id="switch-camera-btn" title="Tukar Kamera">
                🔄
            </button>
        </div>
    </div>

    <!-- ==================== HALAMAN GALERI ==================== -->
    <div id="gallery-page">
        <div class="gallery-header">
            <button class="btn-back" id="back-to-camera-btn">
                ← <span>Kamera</span>
            </button>
            <h2>📸 Galeri Foto</h2>
            <div class="gallery-actions">
                <button class="btn-action success" id="download-all-btn" disabled>
                    📦 Download All
                </button>
                <button class="btn-action danger" id="delete-all-btn" disabled>
                    🗑️ Hapus Semua
                </button>
            </div>
        </div>
        <div class="photo-grid" id="photo-grid"></div>
        <div class="empty-message" id="empty-message">
            <span class="icon">📭</span>
            <p>Belum ada foto yang diambil.<br>Kembali ke kamera dan ambil foto pertama kamu!</p>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        (function() {
            // ==================== DOM ELEMENTS ====================
            const cameraPage = document.getElementById('camera-page');
            const galleryPage = document.getElementById('gallery-page');
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            const flashOverlay = document.getElementById('flash-overlay');
            const permissionMessage = document.getElementById('permission-message');
            const captureBtn = document.getElementById('capture-btn');
            const switchCameraBtn = document.getElementById('switch-camera-btn');
            const galleryBtn = document.getElementById('gallery-btn');
            const photoCountBadge = document.getElementById('photo-count-badge');
            const backToCameraBtn = document.getElementById('back-to-camera-btn');
            const photoGrid = document.getElementById('photo-grid');
            const emptyMessage = document.getElementById('empty-message');
            const downloadAllBtn = document.getElementById('download-all-btn');
            const deleteAllBtn = document.getElementById('delete-all-btn');
            const retryCameraBtn = document.getElementById('retry-camera-btn');
            const toast = document.getElementById('toast');

            // ==================== STATE ====================
            let currentStream = null;
            let isFrontCamera = true; // default: kamera depan (user)
            let toastTimer = null;

            // ==================== INDEXEDDB SETUP ====================
            const DB_NAME = 'WebCameraDB';
            const DB_VERSION = 1;
            const STORE_NAME = 'photos';

            function openDB() {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open(DB_NAME, DB_VERSION);
                    request.onupgradeneeded = (e) => {
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains(STORE_NAME)) {
                            db.createObjectStore(STORE_NAME, { keyPath: 'id' });
                        }
                    };
                    request.onsuccess = (e) => resolve(e.target.result);
                    request.onerror = (e) => reject(e.target.error);
                });
            }

            async function addPhoto(dataURL) {
                const db = await openDB();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(STORE_NAME, 'readwrite');
                    const store = tx.objectStore(STORE_NAME);
                    const photo = {
                        id: Date.now().toString() + '-' + Math.random().toString(36).substr(2, 6),
                        dataURL: dataURL,
                        createdAt: Date.now(),
                    };
                    const request = store.add(photo);
                    request.onsuccess = () => resolve(photo);
                    request.onerror = () => reject(request.error);
                    tx.oncomplete = () => db.close();
                });
            }

            async function getAllPhotos() {
                const db = await openDB();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(STORE_NAME, 'readonly');
                    const store = tx.objectStore(STORE_NAME);
                    const request = store.getAll();
                    request.onsuccess = () => {
                        // Urutkan dari terbaru
                        const photos = request.result.sort((a, b) => b.createdAt - a.createdAt);
                        resolve(photos);
                    };
                    request.onerror = () => reject(request.error);
                    tx.oncomplete = () => db.close();
                });
            }

            async function deletePhoto(id) {
                const db = await openDB();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(STORE_NAME, 'readwrite');
                    const store = tx.objectStore(STORE_NAME);
                    const request = store.delete(id);
                    request.onsuccess = () => resolve();
                    request.onerror = () => reject(request.error);
                    tx.oncomplete = () => db.close();
                });
            }

            async function deleteAllPhotos() {
                const db = await openDB();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(STORE_NAME, 'readwrite');
                    const store = tx.objectStore(STORE_NAME);
                    const request = store.clear();
                    request.onsuccess = () => resolve();
                    request.onerror = () => reject(request.error);
                    tx.oncomplete = () => db.close();
                });
            }

            async function getPhotoCount() {
                const db = await openDB();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(STORE_NAME, 'readonly');
                    const store = tx.objectStore(STORE_NAME);
                    const request = store.count();
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                    tx.oncomplete = () => db.close();
                });
            }

            // ==================== TOAST ====================
            function showToast(message) {
                if (toastTimer) clearTimeout(toastTimer);
                toast.textContent = message;
                toast.classList.add('show');
                toastTimer = setTimeout(() => {
                    toast.classList.remove('show');
                }, 2200);
            }

            // ==================== CAMERA ====================
            async function startCamera(facingMode = 'user') {
                // Hentikan stream sebelumnya
                if (currentStream) {
                    currentStream.getTracks().forEach(track => track.stop());
                    currentStream = null;
                }

                try {
                    const constraints = {
                        video: {
                            facingMode: facingMode,
                            width: { ideal: 1920 },
                            height: { ideal: 1440 },
                        },
                        audio: false,
                    };
                    const stream = await navigator.mediaDevices.getUserMedia(constraints);
                    currentStream = stream;
                    video.srcObject = stream;
                    isFrontCamera = (facingMode === 'user');

                    // Mirror video jika kamera depan
                    if (isFrontCamera) {
                        video.classList.add('mirror');
                    } else {
                        video.classList.remove('mirror');
                    }

                    // Sembunyikan pesan permission
                    permissionMessage.style.display = 'none';
                    video.style.display = 'block';

                    // Tunggu video siap
                    await new Promise((resolve) => {
                        video.onloadedmetadata = () => {
                            // Set canvas size sesuai video
                            canvas.width = video.videoWidth;
                            canvas.height = video.videoHeight;
                            resolve();
                        };
                        // Fallback jika onloadedmetadata sudah ter-trigger
                        if (video.readyState >= 2) {
                            canvas.width = video.videoWidth;
                            canvas.height = video.videoHeight;
                            resolve();
                        }
                    });

                    console.log(
                        `✅ Kamera ${isFrontCamera ? 'depan' : 'belakang'} aktif | Resolusi: ${video.videoWidth}x${video.videoHeight}`
                        );
                } catch (err) {
                    console.error('❌ Gagal mengakses kamera:', err);
                    // Tampilkan pesan permission
                    permissionMessage.style.display = 'flex';
                    video.style.display = 'none';
                    if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
                        permissionMessage.querySelector('h3').textContent = 'Izin Kamera Ditolak';
                        permissionMessage.querySelector('p').textContent =
                            'Kamu perlu mengizinkan akses kamera di pengaturan browser untuk menggunakan fitur ini.';
                    } else if (err.name === 'NotFoundError' || err.name === 'DevicesNotFoundError') {
                        permissionMessage.querySelector('h3').textContent = 'Kamera Tidak Ditemukan';
                        permissionMessage.querySelector('p').textContent =
                            'Perangkat ini tidak memiliki kamera atau kamera sedang digunakan aplikasi lain.';
                    } else {
                        permissionMessage.querySelector('h3').textContent = 'Gagal Mengakses Kamera';
                        permissionMessage.querySelector('p').textContent =
                            'Terjadi kesalahan: ' + err.message;
                    }
                }
            }

            function stopCamera() {
                if (currentStream) {
                    currentStream.getTracks().forEach(track => track.stop());
                    currentStream = null;
                }
                video.srcObject = null;
            }

            // Switch kamera
            switchCameraBtn.addEventListener('click', async () => {
                const newFacingMode = isFrontCamera ? 'environment' : 'user';
                await startCamera(newFacingMode);
            });

            // Retry camera
            retryCameraBtn.addEventListener('click', async () => {
                await startCamera('user');
            });

            // ==================== CAPTURE PHOTO ====================
            captureBtn.addEventListener('click', async () => {
                if (!currentStream || !video.videoWidth) {
                    showToast('⚠️ Kamera belum siap');
                    return;
                }

                // Efek flash
                flashOverlay.classList.add('active');
                setTimeout(() => flashOverlay.classList.remove('active'), 150);

                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                if (isFrontCamera) {
                    // Mirror hasil foto agar sesuai tampilan kamera depan
                    ctx.save();
                    ctx.translate(canvas.width, 0);
                    ctx.scale(-1, 1);
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    ctx.restore();
                } else {
                    // Kamera belakang: tidak perlu mirror
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                }

                const dataURL = canvas.toDataURL('image/png');

                try {
                    await addPhoto(dataURL);
                    await updatePhotoBadge();
                    showToast('📸 Foto berhasil disimpan!');
                    // Animasi kecil pada tombol capture
                    captureBtn.style.transform = 'scale(0.85)';
                    setTimeout(() => { captureBtn.style.transform = ''; }, 150);
                } catch (err) {
                    console.error('Gagal menyimpan foto:', err);
                    showToast('❌ Gagal menyimpan foto');
                }
            });

            // ==================== NAVIGASI ====================
            galleryBtn.addEventListener('click', async () => {
                stopCamera();
                cameraPage.classList.add('hidden');
                galleryPage.classList.add('active');
                await loadGallery();
            });

            backToCameraBtn.addEventListener('click', async () => {
                galleryPage.classList.remove('active');
                cameraPage.classList.remove('hidden');
                await startCamera(isFrontCamera ? 'user' : 'environment');
                await updatePhotoBadge();
            });

            // ==================== GALLERY ====================
            async function loadGallery() {
                const photos = await getAllPhotos();
                photoGrid.innerHTML = '';
                updateGalleryButtons(photos.length);

                if (photos.length === 0) {
                    emptyMessage.style.display = 'flex';
                    photoGrid.style.display = 'none';
                } else {
                    emptyMessage.style.display = 'none';
                    photoGrid.style.display = 'grid';
                    photos.forEach((photo, index) => {
                        const item = document.createElement('div');
                        item.className = 'photo-item';
                        item.style.animationDelay = `${index * 0.04}s`;
                        item.innerHTML = `
                            <img src="${photo.dataURL}" alt="Foto ${index + 1}" loading="lazy">
                            <div class="photo-actions">
                                <button class="btn-sm download" data-id="${photo.id}" title="Download">
                                    ⬇️
                                </button>
                                <button class="btn-sm delete" data-id="${photo.id}" title="Hapus">
                                    ❌
                                </button>
                            </div>
                        `;
                        photoGrid.appendChild(item);
                    });

                    // Event delegation untuk tombol di setiap foto
                    photoGrid.querySelectorAll('.btn-sm.delete').forEach(btn => {
                        btn.addEventListener('click', async (e) => {
                            e.stopPropagation();
                            const id = btn.getAttribute('data-id');
                            await deletePhoto(id);
                            showToast('🗑️ Foto dihapus');
                            await loadGallery();
                            await updatePhotoBadge();
                        });
                    });

                    photoGrid.querySelectorAll('.btn-sm.download').forEach(btn => {
                        btn.addEventListener('click', async (e) => {
                            e.stopPropagation();
                            const id = btn.getAttribute('data-id');
                            const allPhotos = await getAllPhotos();
                            const photo = allPhotos.find(p => p.id === id);
                            if (photo) {
                                downloadSinglePhoto(photo.dataURL);
                            }
                        });
                    });
                }
            }

            function updateGalleryButtons(count) {
                if (count === 0) {
                    downloadAllBtn.disabled = true;
                    deleteAllBtn.disabled = true;
                } else {
                    downloadAllBtn.disabled = false;
                    deleteAllBtn.disabled = false;
                }
            }

            // Download single photo
            function downloadSinglePhoto(dataURL) {
                const link = document.createElement('a');
                link.href = dataURL;
                link.download = 'webfoto.png';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast('⬇️ Foto didownload (webfoto.png)');
            }

            // Download all photos as ZIP
            downloadAllBtn.addEventListener('click', async () => {
                const photos = await getAllPhotos();
                if (photos.length === 0) {
                    showToast('📭 Tidak ada foto untuk didownload');
                    return;
                }

                try {
                    showToast('📦 Membuat file ZIP...');
                    const zip = new JSZip();
                    photos.forEach((photo, index) => {
                        // Hapus prefix data:image/png;base64,
                        const base64Data = photo.dataURL.replace(/^data:image\/\w+;base64,/, '');
                        zip.file(`webfoto_${index + 1}.png`, base64Data, { base64: true });
                    });

                    const zipBlob = await zip.generateAsync({
                        type: 'blob',
                        compression: 'DEFLATE',
                        compressionOptions: { level: 6 },
                    });

                    // Download zip
                    const url = URL.createObjectURL(zipBlob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = 'webfotoall.zip';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    URL.revokeObjectURL(url);

                    showToast(`📦 ${photos.length} foto didownload (webfotoall.zip)`);
                } catch (err) {
                    console.error('Gagal membuat ZIP:', err);
                    showToast('❌ Gagal membuat file ZIP');
                }
            });

            // Delete all photos
            deleteAllBtn.addEventListener('click', async () => {
                const photos = await getAllPhotos();
                if (photos.length === 0) {
                    showToast('📭 Tidak ada foto untuk dihapus');
                    return;
                }

                if (confirm(`Yakin ingin menghapus semua ${photos.length} foto? Tindakan ini tidak bisa dibatalkan.`)) {
                    await deleteAllPhotos();
                    showToast('🗑️ Semua foto dihapus');
                    await loadGallery();
                    await updatePhotoBadge();
                }
            });

            // ==================== BADGE JUMLAH FOTO ====================
            async function updatePhotoBadge() {
                const count = await getPhotoCount();
                if (count > 0) {
                    photoCountBadge.style.display = 'flex';
                    photoCountBadge.textContent = count > 99 ? '99+' : count;
                } else {
                    photoCountBadge.style.display = 'none';
                }
            }

            // ==================== KEYBOARD SHORTCUT ====================
            document.addEventListener('keydown', (e) => {
                // Spasi untuk capture (hanya di halaman kamera)
                if (e.code === 'Space' && !galleryPage.classList.contains('active') && !cameraPage.classList
                    .contains('hidden')) {
                    e.preventDefault();
                    captureBtn.click();
                }
                // Escape untuk kembali ke kamera
                if (e.code === 'Escape' && galleryPage.classList.contains('active')) {
                    backToCameraBtn.click();
                }
            });

            // ==================== INIT ====================
            async function init() {
                await updatePhotoBadge();
                await startCamera('user');
            }

            // Cek apakah browser mendukung getUserMedia
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                permissionMessage.style.display = 'flex';
                permissionMessage.querySelector('h3').textContent = 'Browser Tidak Mendukung';
                permissionMessage.querySelector('p').textContent =
                    'Browser kamu tidak mendukung akses kamera. Gunakan browser modern seperti Chrome, Edge, atau Safari.';
                video.style.display = 'none';
                retryCameraBtn.style.display = 'none';
            } else {
                init();
            }

            console.log('📸 Web Camera siap!');
            console.log('   - Tekan tombol bulat putih untuk mengambil foto');
            console.log('   - Tekan 🖼️ untuk melihat galeri');
            console.log('   - Tekan 🔄 untuk tukar kamera depan/belakang');
            console.log('   - Shortcut: Spasi = capture, Esc = kembali ke kamera');
            console.log('   - Kamera depan otomatis mirror (efek cermin)');
            console.log('   - Download single: webfoto.png');
            console.log('   - Download all: webfotoall.zip');
        })();
    </script>
</body>
</html>
