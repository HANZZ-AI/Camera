<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NexCam - Kamera RGB Merah</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at 20% 30%, #0a0000, #1a0303);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            font-family: 'Poppins', 'Segoe UI', system-ui, -apple-system, 'Inter', sans-serif;
        }

        .camera-neon {
            max-width: 600px;
            width: 100%;
            background: rgba(20, 5, 5, 0.75);
            backdrop-filter: blur(12px);
            border-radius: 48px;
            border: 1px solid rgba(255, 40, 40, 0.7);
            box-shadow: 0 20px 40px rgba(255, 0, 0, 0.25), 0 0 18px rgba(255, 30, 30, 0.5);
            padding: 20px 20px 30px;
        }

        .brand {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 12px;
            flex-wrap: wrap;
            border-bottom: 1px dashed #ff4d4d;
            padding-bottom: 8px;
        }
        h1 {
            font-size: 1.9rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ff4d4d, #ff9999);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 8px rgba(255,0,0,0.4);
        }
        .dev-by {
            background: #ff1a1a30;
            backdrop-filter: blur(4px);
            padding: 5px 12px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: bold;
            color: #ffb3b3;
            border: 0.5px solid #ff4444;
        }
        .dev-by span {
            color: #ff8080;
        }

        .video-box {
            background: #000000aa;
            border-radius: 32px;
            overflow: hidden;
            margin: 15px 0 18px;
            border: 2px solid #ff3333;
            box-shadow: 0 0 0 2px #7a0000, 0 10px 25px rgba(0,0,0,0.5);
        }
        video {
            width: 100%;
            height: auto;
            display: block;
            background: #111;
        }

        .action-row {
            display: flex;
            justify-content: center;
            gap: 18px;
            margin: 12px 0 20px;
            flex-wrap: wrap;
        }
        .btn {
            border: none;
            background: #2c0a0a;
            padding: 12px 20px;
            border-radius: 60px;
            font-weight: bold;
            font-size: 1rem;
            color: #ffc2c2;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            border: 1px solid #ff4f4f;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            transition: 0.1s;
        }
        .btn-primary {
            background: #e60000;
            color: white;
            box-shadow: 0 0 12px #ff3a3a;
            border: none;
        }
        .btn-primary:active { transform: scale(0.96); background: #cc0000;}
        .btn:active { transform: scale(0.96);}
        .btn-outline-red {
            background: #1f0505;
            border: 1px solid #ff6666;
        }
        .icon {
            font-size: 1.3rem;
        }

        .mini-gallery {
            background: rgba(0,0,0,0.6);
            border-radius: 28px;
            padding: 12px;
            margin-top: 12px;
            border: 1px solid #ff4d4d60;
        }
        .mini-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding: 0 6px;
            color: #ffbaba;
            font-weight: 600;
        }
        .thumb-scroll {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 8px;
        }
        .thumb-item {
            width: 75px;
            height: 75px;
            background: #2b0a0a;
            border-radius: 18px;
            overflow: hidden;
            border: 2px solid #ff5e5e;
            flex-shrink: 0;
            position: relative;
        }
        .thumb-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .delete-one {
            position: absolute;
            top: 2px;
            right: 2px;
            background: #aa0000dd;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: white;
            font-weight: bold;
        }
        .empty-text {
            text-align: center;
            color: #ffaaaa;
            padding: 20px;
            font-style: italic;
        }
        .status-msg {
            background: #270000aa;
            border-radius: 40px;
            padding: 6px 12px;
            margin-top: 15px;
            text-align: center;
            font-size: 0.75rem;
            color: #ffaaaa;
        }
        footer {
            font-size: 0.65rem;
            text-align: center;
            margin-top: 18px;
            color: #cc7a7a;
        }
        .btn-sm {
            background: #4a1212;
            padding: 6px 12px;
            font-size: 0.7rem;
            border: none;
            border-radius: 30px;
            color: white;
            cursor: pointer;
        }
        @media (max-width: 500px) {
            .camera-neon { padding: 14px; }
            .btn { padding: 10px 14px; font-size: 0.85rem; }
        }
    </style>
</head>
<body>
<div class="camera-neon">
    <div class="brand">
        <h1>◉ NEXCAM</h1>
        <div class="dev-by">⚡ Dev by <span>HANZZ</span> ⚡</div>
    </div>
    
    <div class="video-box">
        <video id="videoElement" autoplay playsinline muted></video>
    </div>

    <div class="action-row">
        <button id="captureBtn" class="btn btn-primary"><span class="icon">📸</span> JEPRET</button>
        <button id="switchCamBtn" class="btn btn-outline-red"><span class="icon">🔄</span> Ganti Kamera</button>
        <button id="galleryRedirectBtn" class="btn btn-outline-red"><span class="icon">🖼️</span> Cek Foto</button>
    </div>

    <div class="mini-gallery">
        <div class="mini-header">
            <span>📸 Foto terbaru <span id="photoCountBadge" style="background:#ff3a3a50; border-radius: 20px; padding:2px 8px; margin-left:6px;">0</span></span>
            <button id="resetMiniBtn" class="btn-sm" style="background:#8b0000;">🗑️ Hapus Semua</button>
        </div>
        <div id="miniThumbList" class="thumb-scroll">
            <div class="empty-text">✨ Belum ada foto, ambil dulu yuk!</div>
        </div>
    </div>
    <div class="status-msg" id="camStatus">🔴 Menyalakan kamera RGB ...</div>
    <footer>📱 Kamera depan MIRROR (seperti cermin) | Kamera belakang NORMAL | Foto Tersimpan Tidak Terbatas</footer>
</div>

<script>
    (function(){
        const video = document.getElementById('videoElement');
        const captureBtn = document.getElementById('captureBtn');
        const switchCamBtn = document.getElementById('switchCamBtn');
        const galleryRedirectBtn = document.getElementById('galleryRedirectBtn');
        const miniThumbDiv = document.getElementById('miniThumbList');
        const resetMiniBtn = document.getElementById('resetMiniBtn');
        const camStatusSpan = document.getElementById('camStatus');
        const photoCountBadge = document.getElementById('photoCountBadge');

        let currentStream = null;
        let facingMode = "environment";   // environment = belakang (normal), user = depan (mirror)
        let photosArray = [];              // simpan base64, TIDAK TERBATAS

        // Fungsi mengatur mirror CSS (kamera depan mirror, belakang normal)
        function updateVideoMirror() {
            if (facingMode === 'user') {
                video.style.transform = 'scaleX(-1)';  // MIRROR untuk kamera depan
            } else {
                video.style.transform = 'scaleX(1)';   // NORMAL untuk kamera belakang
            }
        }

        // update badge jumlah foto
        function updatePhotoCountBadge() {
            if(photoCountBadge) {
                photoCountBadge.innerText = photosArray.length;
            }
        }

        function renderMiniGallery() {
            miniThumbDiv.innerHTML = '';
            updatePhotoCountBadge();
            
            if(photosArray.length === 0){
                const emptyDiv = document.createElement('div');
                emptyDiv.className = 'empty-text';
                emptyDiv.innerText = '📭 Belum ada foto, ambil dulu yuk!';
                miniThumbDiv.appendChild(emptyDiv);
                return;
            }
            // tampilkan terbaru di depan (reverse)
            const reversed = [...photosArray].reverse();
            for(let i=0; i<reversed.length; i++){
                const imgData = reversed[i];
                const originalIndex = photosArray.length - 1 - i;
                const thumbDiv = document.createElement('div');
                thumbDiv.className = 'thumb-item';
                const img = document.createElement('img');
                img.src = imgData;
                const delBtn = document.createElement('div');
                delBtn.innerText = '✕';
                delBtn.className = 'delete-one';
                delBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    deletePhotoByIndex(originalIndex);
                });
                thumbDiv.appendChild(img);
                thumbDiv.appendChild(delBtn);
                miniThumbDiv.appendChild(thumbDiv);
            }
        }

        function deletePhotoByIndex(idx){
            if(idx >=0 && idx < photosArray.length){
                photosArray.splice(idx,1);
                saveToLocal();
                renderMiniGallery();
                showStatusTemporary('🗑️ Foto dihapus', 1000);
            }
        }

        function resetAllPhotos(){
            if(photosArray.length > 0){
                photosArray = [];
                saveToLocal();
                renderMiniGallery();
                showStatusTemporary('✅ Semua foto telah dihapus', 1500);
            } else {
                showStatusTemporary('⚠️ Tidak ada foto untuk dihapus', 1000);
            }
        }

        function saveToLocal(){
            try {
                localStorage.setItem('nexcam_photos', JSON.stringify(photosArray));
            } catch(e) {
                console.warn("localStorage mungkin penuh? Tapi tidak ada batasan dari kode ini");
                // Jika kuota storage habis, beri tahu user
                if(e.name === 'QuotaExceededError') {
                    alert('Penyimpanan browser penuh! Hapus beberapa foto untuk menyimpan yang baru.');
                }
            }
        }

        function loadFromLocal(){
            const stored = localStorage.getItem('nexcam_photos');
            if(stored){
                try {
                    const parsed = JSON.parse(stored);
                    if(Array.isArray(parsed)){
                        photosArray = parsed;
                        renderMiniGallery();
                    }
                } catch(e){}
            } else {
                photosArray = [];
                renderMiniGallery();
            }
        }

        function showStatusTemporary(msg, duration = 1500) {
            const originalText = camStatusSpan.innerText;
            camStatusSpan.innerText = msg;
            setTimeout(() => {
                if(currentStream) {
                    if(facingMode === 'environment') camStatusSpan.innerText = '✅ Kamera BELAKANG (normal) aktif';
                    else camStatusSpan.innerText = '✅ Kamera DEPAN (mirror) aktif';
                } else {
                    camStatusSpan.innerText = originalText;
                }
            }, duration);
        }

        function stopStream(){
            if(currentStream){
                currentStream.getTracks().forEach(track => {
                    if(track.readyState === 'live') track.stop();
                });
                currentStream = null;
            }
        }

        async function initCamera(facing) {
            stopStream();
            const constraints = {
                video: {
                    facingMode: { exact: facing } ,
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                }
            };
            try {
                camStatusSpan.innerText = `🔄 Mengakses kamera ${facing === 'environment' ? 'belakang' : 'depan'} ...`;
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                handleStream(stream);
                updateVideoMirror();
                return true;
            } catch(err){
                console.warn(`gagal dengan facingMode ${facing}, coba non-exact`, err);
                try{
                    const fallbackConstraints = { video: { facingMode: facing } };
                    const fallbackStream = await navigator.mediaDevices.getUserMedia(fallbackConstraints);
                    handleStream(fallbackStream);
                    updateVideoMirror();
                    return true;
                } catch(err2){
                    console.error("gagal total kamera :", err2);
                    camStatusSpan.innerText = '❌ Gagal akses kamera / izin ditolak';
                    return false;
                }
            }
        }

        function handleStream(stream){
            currentStream = stream;
            video.srcObject = stream;
            video.onloadedmetadata = () => {
                video.play();
                if(facingMode === 'environment') camStatusSpan.innerText = '✅ Kamera BELAKANG (normal) siap';
                else camStatusSpan.innerText = '✅ Kamera DEPAN (mirror/cermin) siap';
            };
            video.onerror = () => camStatusSpan.innerText = '⚠️ Error video stream';
        }

        async function switchCamera(){
            const newMode = (facingMode === 'environment') ? 'user' : 'environment';
            const success = await initCamera(newMode);
            if(success){
                facingMode = newMode;
                updateVideoMirror();
                if(facingMode === 'environment') camStatusSpan.innerText = '🔄 Beralih ke kamera BELAKANG (normal)';
                else camStatusSpan.innerText = '🔄 Beralih ke kamera DEPAN (mirror)';
            } else {
                camStatusSpan.innerText = '⚠️ Gagal ganti kamera, pastikan izin & multi kamera tersedia';
            }
        }

        // Fungsi capture foto: 
        // - Untuk kamera depan (mirror visual) tapi hasil foto harus seperti asli (tidak terbalik)
        // - Untuk kamera belakang normal langsung
        function capturePhoto(){
            if(!video.videoWidth || !video.videoHeight){
                showStatusTemporary('⏳ Kamera belum siap, tunggu sebentar...', 1000);
                return;
            }
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            
            // Penting: Karena video bisa di-mirror secara CSS (scaleX(-1)) hanya untuk tampilan,
            // maka ketika capture harus disesuaikan agar hasil foto tidak mirror (natural).
            // Cek apakah sedang mode mirror (kamera depan)
            if (facingMode === 'user') {
                // Kamera depan: secara CSS di-mirror. Kita perlu membalik lagi saat menggambar ke canvas.
                ctx.save();
                ctx.scale(-1, 1);
                ctx.drawImage(video, -canvas.width, 0, canvas.width, canvas.height);
                ctx.restore();
            } else {
                // Kamera belakang: normal, gambar langsung
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            }
            
            const photoURL = canvas.toDataURL('image/png');
            photosArray.push(photoURL);
            saveToLocal();
            renderMiniGallery();
            
            // efek kilat flash merah
            const flashDiv = document.createElement('div');
            flashDiv.style.position = 'fixed'; flashDiv.style.top=0; flashDiv.style.left=0; 
            flashDiv.style.width='100%'; flashDiv.style.height='100%';
            flashDiv.style.background = 'rgba(255,50,50,0.7)'; 
            flashDiv.style.pointerEvents = 'none'; flashDiv.style.zIndex = 9999;
            document.body.appendChild(flashDiv);
            setTimeout(()=> flashDiv.remove(), 100);
            
            const totalFoto = photosArray.length;
            showStatusTemporary(`📸 Foto berhasil! (Total ${totalFoto} foto tersimpan)`, 1200);
        }

        function goToGallery(){
            saveToLocal();
            // jika file index2.html tersedia, arahkan ke sana
            window.location.href = 'index2.html';
        }

        // event binding
        captureBtn.addEventListener('click', capturePhoto);
        switchCamBtn.addEventListener('click', switchCamera);
        galleryRedirectBtn.addEventListener('click', goToGallery);
        resetMiniBtn.addEventListener('click', resetAllPhotos);

        loadFromLocal();

        if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
            camStatusSpan.innerText = '❌ Browser tidak support kamera.';
            document.querySelector('.video-box').style.background = '#220000';
        } else {
            // default: kamera belakang (normal)
            initCamera('environment').catch(()=>{
                camStatusSpan.innerText = '⚠️ Gagal buka kamera belakang, coba depan';
                initCamera('user').catch(()=>{
                    camStatusSpan.innerText = '❌ Akses kamera ditolak';
                });
            });
        }

        window.addEventListener('beforeunload', ()=>{
            if(currentStream){
                currentStream.getTracks().forEach(t=>t.stop());
            }
        });
        
        // Tambahan: cek limit storage, tapi tetap tidak membatasi jumlah foto (hanya batasan storage browser)
        // user bisa menyimpan hingga kuota habis (biasanya puluhan MB). Tidak ada batasan buatan.
    })();
</script>
</body>
</html>
