<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Galeri NEXCAM - Foto HANZZ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: radial-gradient(circle at 80% 10%, #0a0101, #1a0303);
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            padding: 20px;
        }
        .gallery-container {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(25, 5, 5, 0.7);
            backdrop-filter: blur(16px);
            border-radius: 48px;
            border: 1px solid #ff4a4a;
            box-shadow: 0 20px 30px rgba(255,0,0,0.2);
            padding: 20px 24px 32px;
        }
        .header-gal {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid #ff5e5e;
        }
        h2 {
            font-size: 1.8rem;
            background: linear-gradient(135deg, #ff5e5e, #ffaaaa);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .dev-tag {
            background: #a12222;
            padding: 4px 14px;
            border-radius: 100px;
            font-size: 0.7rem;
            font-weight: bold;
            color: #ffdddd;
        }
        .control-buttons {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .btn-gal {
            background: #2f0a0a;
            border: 1px solid #ff5c5c;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: bold;
            color: #ffc6c6;
            cursor: pointer;
            transition: 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
        }
        .btn-danger {
            background: #9e1a1a;
            color: white;
            border: none;
        }
        .btn-save {
            background: #1c6b2b;
            border-color: #6eff6e;
            color: white;
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 18px;
            margin-top: 12px;
        }
        .photo-card {
            background: #1f0808;
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid #ff6b6b;
            transition: 0.1s;
            box-shadow: 0 5px 12px rgba(0,0,0,0.5);
            position: relative;
        }
        .photo-card img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            display: block;
            background: #100000;
        }
        .card-actions {
            display: flex;
            justify-content: space-between;
            padding: 8px 10px;
            background: #2d0b0be0;
            backdrop-filter: blur(2px);
        }
        .del-single {
            background: #aa2e2e;
            border: none;
            color: white;
            padding: 5px 12px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: bold;
            cursor: pointer;
        }
        .download-single {
            background: #1f4f2d;
            border: none;
            color: white;
            padding: 5px 12px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.7rem;
        }
        .empty-gal {
            text-align: center;
            color: #ffaeae;
            padding: 60px 20px;
            font-size: 1.2rem;
            background: #26080860;
            border-radius: 38px;
        }
        .back-home {
            margin-top: 24px;
            text-align: center;
        }
        .btn-back {
            background: #3f0f0f;
            border: 1px solid #ff7a7a;
            padding: 8px 20px;
            border-radius: 60px;
            color: #ffb7b7;
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
        }
        .stat-badge {
            background: #3a0e0e;
            padding: 5px 14px;
            border-radius: 28px;
            font-size: 0.8rem;
            color: #ffaaaa;
        }
        @media (max-width: 550px) {
            .gallery-grid { grid-template-columns: repeat(auto-fill, minmax(130px,1fr));}
            .gallery-container { padding: 16px; }
        }
    </style>
</head>
<body>
<div class="gallery-container">
    <div class="header-gal">
        <h2>🎞️ GALERI NEXCAM</h2>
        <div class="dev-tag">by HANZZ · RGB series</div>
    </div>
    <div class="control-buttons">
        <button id="deleteAllBtn" class="btn-gal btn-danger">🗑️ Hapus Semua</button>
        <button id="downloadAllBtn" class="btn-gal btn-save">📦 Download Semua (ZIP)</button>
    </div>
    <div id="galleryGrid" class="gallery-grid">
        <div class="empty-gal">📭 Memuat foto ...</div>
    </div>
    <div class="back-home">
        <a href="index.html" class="btn-back">◀ Kembali ke Kamera NEXCAM</a>
    </div>
    <div style="text-align: center; margin-top: 20px; font-size: 0.7rem; color:#ff9494;">Klik hapus / download per foto | semua foto tersimpan di browser</div>
</div>

<script>
    (function(){
        let photoArray = [];

        const galleryDiv = document.getElementById('galleryGrid');
        const deleteAllBtn = document.getElementById('deleteAllBtn');
        const downloadAllBtn = document.getElementById('downloadAllBtn');

        // Fungsi untuk menghasilkan nama file sesuai permintaan: hasilfotobyhanzz1.png, hasilfotobyhanzz2.png ...
        function generateFileName(index) {
            // index dimulai dari 1 untuk pengguna
            return `hasilfotobyhanzz${index}.png`;
        }

        function loadPhotos(){
            const stored = localStorage.getItem('nexcam_photos');
            if(stored){
                try{
                    const parsed = JSON.parse(stored);
                    if(Array.isArray(parsed)){
                        photoArray = parsed;
                    } else {
                        photoArray = [];
                    }
                } catch(e){ photoArray = []; }
            } else {
                photoArray = [];
            }
            renderGallery();
        }

        function persist(){
            localStorage.setItem('nexcam_photos', JSON.stringify(photoArray));
        }

        function deletePhoto(index){
            if(index >=0 && index < photoArray.length){
                photoArray.splice(index,1);
                persist();
                renderGallery();
            }
        }

        function deleteAll(){
            if(photoArray.length === 0) return;
            if(confirm('⚠️ Hapus SEMUA foto? Tindakan permanen.')){
                photoArray = [];
                persist();
                renderGallery();
            }
        }

        // download satu foto dengan nama "hasilfotobyhanzz[nomor].png"
        function downloadSingle(imgData, customFileName) {
            const link = document.createElement('a');
            link.href = imgData;
            link.download = customFileName;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // download semua foto sebagai ZIP dengan penamaan hasilfotobyhanzz1.png dll
        async function downloadAllAsZip(){
            if(photoArray.length === 0){
                alert('Tidak ada foto untuk diunduh.');
                return;
            }
            // pastikan JSZip tersedia
            if(typeof JSZip === 'undefined'){
                const script = document.createElement('script');
                script.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
                script.onload = () => {
                    createAndDownloadZip();
                };
                document.head.appendChild(script);
            } else {
                createAndDownloadZip();
            }
        }

        async function createAndDownloadZip(){
            const JSZipLib = window.JSZip;
            const zip = new JSZipLib();
            for(let i = 0; i < photoArray.length; i++){
                const base64Data = photoArray[i];
                const byteString = atob(base64Data.split(',')[1]);
                const mimeString = base64Data.split(',')[0].split(':')[1].split(';')[0];
                const ab = new ArrayBuffer(byteString.length);
                const ia = new Uint8Array(ab);
                for(let j = 0; j < byteString.length; j++){
                    ia[j] = byteString.charCodeAt(j);
                }
                const blob = new Blob([ab], {type: mimeString});
                // penamaan: hasilfotobyhanzz1.png, hasilfotobyhanzz2.png, sesuai urutan array (index mulai 1)
                const fileName = generateFileName(i + 1);
                zip.file(fileName, blob);
            }
            const content = await zip.generateAsync({type: "blob"});
            const link = document.createElement('a');
            link.href = URL.createObjectURL(content);
            link.download = `hasilfotobyhanzz_semua.zip`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(link.href);
        }

        function renderGallery(){
            galleryDiv.innerHTML = '';
            if(photoArray.length === 0){
                const emptyMsg = document.createElement('div');
                emptyMsg.className = 'empty-gal';
                emptyMsg.innerText = '📸 Belum ada foto. Buka kamera dan jepret momen!';
                galleryDiv.appendChild(emptyMsg);
                return;
            }

            // tampilkan dari yang terbaru (index terakhir di paling awal)
            for(let i = photoArray.length-1; i >=0; i--){
                const imgData = photoArray[i];
                const card = document.createElement('div');
                card.className = 'photo-card';
                const img = document.createElement('img');
                img.src = imgData;
                const actionsDiv = document.createElement('div');
                actionsDiv.className = 'card-actions';
                const delBtn = document.createElement('button');
                delBtn.innerText = '❌ Hapus';
                delBtn.className = 'del-single';
                const downloadBtn = document.createElement('button');
                downloadBtn.innerText = '⬇️ Download';
                downloadBtn.className = 'download-single';
                // index asli dalam array
                const originalIndex = i; 
                // Nomor urut untuk penamaan (berdasarkan posisi di array, human-friendly: urutan ke berapa)
                // Untuk download per foto, gunakan nomor urut asli + 1 (agar dimulai dari 1)
                const photoNumber = originalIndex + 1;
                delBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    deletePhoto(originalIndex);
                });
                downloadBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const fileName = generateFileName(photoNumber);
                    downloadSingle(imgData, fileName);
                });
                actionsDiv.appendChild(delBtn);
                actionsDiv.appendChild(downloadBtn);
                card.appendChild(img);
                card.appendChild(actionsDiv);
                galleryDiv.appendChild(card);
            }
        }

        deleteAllBtn.addEventListener('click', deleteAll);
        downloadAllBtn.addEventListener('click', downloadAllAsZip);

        loadPhotos();
        window.addEventListener('storage', (e) => {
            if(e.key === 'nexcam_photos'){
                loadPhotos();
            }
        });
        // sinkronisasi antar tab
        setInterval(() => {
            const fresh = localStorage.getItem('nexcam_photos');
            if(fresh){
                try{
                    const newArr = JSON.parse(fresh);
                    if(JSON.stringify(newArr) !== JSON.stringify(photoArray)){
                        photoArray = newArr || [];
                        renderGallery();
                    }
                }catch(ign){}
            }
        }, 800);
    })();
</script>
</body>
</html>
